name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '--win --x64' }
          - { os: ubuntu-latest, args: '--linux --x64' }
          - { os: macos-latest, args: '--mac' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/write-build-info.js
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Generate Windows update manifest
        if: matrix.os == 'windows-latest'
        run: node scripts/gen-latest.js
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: update-manifest
          path: dist/latest.json
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/dist-windows-latest/*.zip
            artifacts/dist-ubuntu-latest/*.AppImage
            artifacts/dist-macos-latest/*.zip
            artifacts/update-manifest/latest.json
          generate_release_notes: true
