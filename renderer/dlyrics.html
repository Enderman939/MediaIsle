<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Desktop Lyrics</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #dl {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
      user-select: none;
      cursor: default;
    }
    #dlText {
      max-width: 96%;
      font-size: var(--dl-size, 32px);
      font-weight: 700;
      letter-spacing: .5px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      -webkit-text-stroke: 1.2px rgba(0, 0, 0, .55);
      text-shadow:
        0 2px 10px rgba(0, 0, 0, .55),
        0 0 22px rgba(30, 215, 96, .25);
      transition: opacity .18s ease;
      opacity: 0;
    }
    /* 译文层: 常驻占位, 保证原文字幕位置不随有无翻译跳动 */
    #dlSub {
      max-width: 96%;
      height: calc(var(--dl-sub-size, 17px) * 1.45);
      margin-top: 2px;
      font-size: var(--dl-sub-size, 17px);
      font-weight: 500;
      letter-spacing: .4px;
      color: rgba(255, 255, 255, .82);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      -webkit-text-stroke: .8px rgba(0, 0, 0, .5);
      text-shadow: 0 1px 8px rgba(0, 0, 0, .55);
      transition: opacity .18s ease;
      opacity: 0;
    }
    #dlText.show { opacity: 1; }
    #dlSub.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="dl">
    <span id="dlText"></span>
    <span id="dlSub"></span>
  </div>
  <script src="dlyrics.js"></script>
</body>
</html>
