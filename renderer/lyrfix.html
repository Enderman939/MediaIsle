<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>歌词纠错 - MediaIsle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #141218;
      overflow: hidden;
      user-select: none;
      cursor: default;
    }
    body {
      font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
      color: #e6e0e9;
      display: flex;
      flex-direction: column;
    }
    .head {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 10px;
    }
    .head .title { flex: 1; font-size: 16px; font-weight: 600; color: #e6e0e9; }
    .head .close {
      appearance: none;
      border: none;
      background: none;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      color: #cac4d0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .head .close:hover { background: rgba(230, 224, 233, .08); }
    .song {
      flex: none;
      padding: 0 16px 10px;
      font-size: 13px;
      color: #cac4d0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status {
      flex: none;
      padding: 0 16px 10px;
      font-size: 12px;
      color: #938f99;
    }
    .list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 10px 12px;
    }
    .list::-webkit-scrollbar { width: 8px; }
    .list::-webkit-scrollbar-thumb {
      background: #49454f;
      border-radius: 999px;
      border: 2px solid #141218;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
    }
    .row:hover { background: rgba(230, 224, 233, .06); }
    .row.picked { background: rgba(208, 188, 255, .12); }
    .row.picked .name::after { content: ' ✓'; color: #d0bcff; }
    .src {
      flex: none;
      font-size: 10px;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(208, 188, 255, .16);
      color: #d0bcff;
    }
    .meta { flex: 1; min-width: 0; }
    .name {
      font-size: 13px;
      color: #e6e0e9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .artist {
      font-size: 11px;
      color: #938f99;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dur {
      flex: none;
      font-size: 11px;
      color: #938f99;
      font-variant-numeric: tabular-nums;
    }
    .empty {
      padding: 30px 16px;
      text-align: center;
      font-size: 12px;
      color: #938f99;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="head">
    <div class="title">歌词纠错</div>
    <button class="close" id="btnClose" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="song" id="songLine"></div>
  <div class="status" id="status">正在搜索候选…</div>
  <div class="list" id="list"></div>
  <script src="lyrfix.js"></script>
</body>
</html>
